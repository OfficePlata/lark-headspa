name = "lark-headspa"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# ============================================================
# Cloudflare D1 Database
# ============================================================
# 1. `wrangler d1 create salon-db` でD1データベースを作成
# 2. 出力されたdatabase_idを以下に貼り付け
# 3. `pnpm db:migrate:remote` でテーブルを作成
# ============================================================
[[d1_databases]]
binding = "SALON_DB"
database_name = "salon-db"
database_id = "5b0712fd-89f5-424e-a03d-8715a45e2385"

# ============================================================
# Cloudflare KV Namespace（セッション・Larkトークンのキャッシュ用）
# ============================================================
# Dashboard 操作の場合:
#   Workers & Pages → KV → Create namespace（名前: salon-kv）
#   Pages プロジェクト → Settings → Functions → KV namespace bindings に
#   Variable name: KV / KV namespace: salon-kv を登録 → Retry deployment
# CLI を使う場合: wrangler kv namespace create salon-kv
# ------------------------------------------------------------
[[kv_namespaces]]
binding = "KV"
id = "a95a4ad330004f47a73c5ffafa61682a"

# ============================================================
# 環境変数（公開しても安全な値）
# ============================================================
[vars]
LARK_DOMAIN = "open.larksuite.com"

# ============================================================
# シークレット（Dashboard > Pages > Settings > Environment Variables で設定）
# ローカル開発時は .dev.vars に記載（.gitignore 対象）
# ============================================================
# AUTH_SECRET        - セッション署名/HMAC 用シークレット（任意の十分長い文字列）
# LARK_APP_ID        - グローバル Lark App ID（サロン未設定時のフォールバック）
# LARK_APP_SECRET    - グローバル Lark App Secret（フォールバック）
